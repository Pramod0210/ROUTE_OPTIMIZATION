constraints:
  max_bus_km_per_month: 4500
  max_bus_km_per_day: 150
  max_bus_time_per_day: 900 # minutes
  max_occupancy: 0.9
  stop_wait_time: 3
  reserve_buses: 3
  max_student_ride_time: 60  # minutes

calendar:
  regular_start: "08:00"
  exam_start: "09:00"


paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  geocode_cache: "data/geocode_cache.csv"
  issues_data: "data/issues"
  logs: "logs"
  school_master: "data/raw/School_Master.xlsx"
  students_processed: "data/processed/students_processed.csv"
  stops_output: "data/processed/stops.csv"
  students_with_stops_output: "data/processed/students_with_stops.csv"

geocode:
  nominatim_delay: 1.1
  sleep_between_calls: 0.2
  max_retries: 3

validation:
  max_city_radius_km: 100.0

address_keywords:
  - "school location"
  - "pickup address"
  - "drop address"
  - "parking spot"


constraints:
  max_walk_meters: 300

clustering:
  mode: "distance"                # or "society"
  society_split_within_meters: 0  # 0 means no internal split; >0 will split large societies

dwell_time_bands:
  - {min: 1, max: 2, wait_min: 2}
  - {min: 3, max: 5, wait_min: 3}
  - {min: 6, max: 9999, wait_min: 4}




lat_suffix: "_lat"
lon_suffix: "_lon"

app_user_agent: "school-transport-optimizer/1.0"
