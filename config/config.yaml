constraints:
  max_bus_km_per_month: 4500
  max_bus_km_per_day: 150
  max_bus_time_per_day: 900 # minutes
  max_occupancy: 0.9
  stop_wait_time: 3
  reserve_buses: 3
  max_student_ride_time: 60  # minutes

calendar:
  regular_start: "08:00"
  exam_start: "09:00"


paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  geocode_cache: "data/geocode_cache.csv"
  issues_data: "data/issues"
  logs: "logs"
  school_master: "data/raw/School_Master.xlsx"
  bus_stop_time: "data/processed/bus_stop_time.csv"
  students_processed: "data/processed/student_master.csv"
  teachers_processed: "data/processed/teacher_master.csv"
  stops_pickup_output: "data/processed/stops_pickup.csv"
  stops_drop_output: "data/processed/stops_drop.csv"
  participants_with_stops_pickup: "data/processed/participants_with_stops_pickup.csv"
  participants_with_stops_drop: "data/processed/participants_with_stops_drop.csv"

geocode:
  nominatim_delay: 1.1
  sleep_between_calls: 0.2
  max_retries: 3

validation:
  max_city_radius_km: 100.0

address_keywords:
  - "school location"
  - "pickup address"
  - "drop address"
  - "parking spot"


constraints:
  max_walk_meters: 300

clustering:
  mode: "distance"                # or "society"
  society_split_within_meters: 0  # 0 means no internal split; >0 will split large societies


lat_suffix: "_lat"
lon_suffix: "_lon"

app_user_agent: "school-transport-optimizer/1.0"
